<ol class="party">
  <li
    *ngFor="let pokemon of members; let i = index; let last = last; trackBy: trackByPokemonId"
    class="party__slot"
    [class.party__slot--lead]="i === 0"
    [class.party__slot--target]="dropIndex() === i"
    [class.party__slot--dragging]="draggingId() === pokemon.id"
    (dragover)="onDragOver($event, i)"
    (dragleave)="onDragLeave($event, i)"
    (drop)="onDrop($event, i)"
  >
    <app-party-card
      [pokemon]="pokemon"
      [slot]="i"
      draggable="true"
      (dragstart)="onDragStart($event, pokemon.id)"
      (dragend)="onDragEnd()"
    ></app-party-card>

    <!-- The keyboard- and touch-friendly twin of drag & drop. -->
    <div class="party__moves">
      <button
        type="button"
        [disabled]="i === 0"
        [attr.aria-label]="'Move ' + (pokemon.name | pokemonName) + ' earlier in the party'"
        (click)="move.emit({ id: pokemon.id, index: i - 1 })"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <button
        type="button"
        [disabled]="last"
        [attr.aria-label]="'Move ' + (pokemon.name | pokemonName) + ' later in the party'"
        (click)="move.emit({ id: pokemon.id, index: i + 1 })"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
      </button>
    </div>
  </li>

  <li
    *ngFor="let slot of emptySlots"
    class="party__slot party__slot--empty"
    [class.party__slot--lead]="slot === 0"
    [class.party__slot--target]="dropIndex() === slot"
    (dragover)="onDragOver($event, slot)"
    (dragleave)="onDragLeave($event, slot)"
    (drop)="onDrop($event, slot)"
  >
    <svg viewBox="0 0 96 96" aria-hidden="true">
      <circle cx="48" cy="48" r="44" />
      <path d="M4 48h34a10 10 0 0 0 20 0h34" />
      <circle cx="48" cy="48" r="8" />
    </svg>
    <span class="party__slot-number">{{ slot + 1 | number: '2.0' }}</span>
    <span class="party__slot-hint">Open slot</span>
  </li>
</ol>
