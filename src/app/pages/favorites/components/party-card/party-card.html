<article
  class="party-card"
  [class.party-card--lead]="slot === 0"
  [appTypeColor]="pokemon.types[0]"
  [style.--accent-2]="(pokemon.types.at(1) ?? pokemon.types[0]) | pokemonTypeColor"
  [style.--enter-delay]="slot * 70 + 'ms'"
  [appMagneticTilt]="slot === 0"
  appEntranceReveal
>
  <app-heart-button
    [pokemonId]="pokemon.id"
    [label]="pokemon.name | pokemonName"
    [type]="pokemon.types[0]"
  ></app-heart-button>

  <span class="party-card__slot" aria-hidden="true">{{ slot + 1 | number: '2.0' }}</span>
  <span class="party-card__watermark" aria-hidden="true">{{ pokemon.id | pokedexId }}</span>

  <div class="party-card__art">
    <img
      [src]="pokemon.id | pokemonArtwork"
      [alt]="pokemon.name | pokemonName"
      width="475"
      height="475"
      decoding="async"
      draggable="false"
      appArtworkFallback
      [appArtTransition]="pokemon.id"
    />
  </div>

  <div class="party-card__body">
    <span class="party-card__role" *ngIf="slot === 0">Party lead</span>
    <span class="party-card__id">{{ pokemon.id | pokedexId }}</span>
    <h3 class="party-card__name"><a class="party-card__link" [routerLink]="['/pokemon', pokemon.id]" [appPokemonLink]="pokemon.id" draggable="false">{{ pokemon.name | pokemonName }}</a></h3>
    <ul class="party-card__types">
      <li *ngFor="let type of pokemon.types" [appTypeColor]="type" appTypeColorMode="fill">{{ type }}</li>
    </ul>
  </div>
</article>
