<article
  class="party-card"
  [class.party-card--lead]="slot === 0"
  [appTypeColor]="pokemon.types[0]"
  [style.--accent-2]="(pokemon.types[1] ?? pokemon.types[0]) | pokemonTypeColor"
  [style.--enter-delay]="slot * 70 + 'ms'"
  [appMagneticTilt]="slot === 0"
  appEntranceReveal
>
  <app-heart-button
    [pokemonId]="pokemon.id"
    [label]="pokemon.name | pokemonName"
    [type]="pokemon.types[0]"
  ></app-heart-button>

  <span class="party-card__slot" aria-hidden="true">{{ slot + 1 | number: '2.0' }}</span>
  <span class="party-card__watermark" aria-hidden="true">{{ pokemon.id | pokedexId }}</span>

  <div class="party-card__art">
    <img
      [src]="pokemon.id | pokemonArtwork"
      [alt]="pokemon.name | pokemonName"
      width="475"
      height="475"
      decoding="async"
      draggable="false"
      appArtworkFallback
    />
  </div>

  <div class="party-card__body">
    <span class="party-card__role" *ngIf="slot === 0">Party lead</span>
    <span class="party-card__id">{{ pokemon.id | pokedexId }}</span>
    <h3 class="party-card__name">{{ pokemon.name | pokemonName }}</h3>
    <ul class="party-card__types">
      <li *ngFor="let type of pokemon.types" [appTypeColor]="type" appTypeColorMode="fill">{{ type }}</li>
    </ul>
  </div>

  <div class="party-card__moves">
    <button
      type="button"
      [disabled]="!canMoveEarlier"
      [attr.aria-label]="'Move ' + (pokemon.name | pokemonName) + ' earlier in the party'"
      (click)="move.emit(-1)"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
    </button>
    <button
      type="button"
      [disabled]="!canMoveLater"
      [attr.aria-label]="'Move ' + (pokemon.name | pokemonName) + ' later in the party'"
      (click)="move.emit(1)"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
    </button>
  </div>
</article>
