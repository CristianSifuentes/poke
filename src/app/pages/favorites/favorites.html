<section class="favorites">
  <header class="favorites__hero">
    <div class="favorites__intro">
      <p class="favorites__eyebrow">Trainer's collection</p>
      <h1>Your Party</h1>
      <p class="favorites__lede">
        Six lead the way; everyone else waits in the Box. Drag a Pokémon onto a slot, or use the arrows,
        to change who's up front.
      </p>
    </div>

    <app-collection-summary
      *ngIf="status() === 'ready' && allPokemon().length"
      [pokemon]="allPokemon()"
    ></app-collection-summary>
  </header>

  <!-- Loading: a party-shaped skeleton, so the layout doesn't jump when data lands -->
  <div class="favorites__skeleton" *ngIf="status() === 'loading' && favorites.count()" aria-busy="true">
    <span *ngFor="let i of skeletons" [style.--i]="i"></span>
  </div>

  <app-state-panel
    *ngIf="status() === 'error'"
    tone="error"
    motion="none"
    heading="The Pokédex couldn't connect"
    text="Your favorites are safe. We just couldn't load their details from PokeAPI."
    actionLabel="Try again"
    (action)="load()"
  ></app-state-panel>

  <ng-container *ngIf="status() === 'ready' || (status() === 'loading' && !favorites.count())">
    <ng-container *ngIf="allPokemon().length; else empty">
      <section class="favorites__section" aria-labelledby="party-heading">
        <div class="favorites__section-head">
          <h2 id="party-heading">The Party <span>{{ party().length }}/{{ partySize }}</span></h2>
          <p>The first slot leads.</p>
        </div>

        <app-party-grid [party]="party()" (move)="moveInParty($event)"></app-party-grid>
      </section>

      <section class="favorites__section" *ngIf="boxCount()" aria-labelledby="box-heading">
        <div class="favorites__section-head">
          <h2 id="box-heading">The Box <span>{{ boxCount() }}</span></h2>
          <p>Waiting for their turn.</p>
        </div>

        <app-box-filters
          [types]="boxTypeCounts()"
          [selectedType]="activeBoxType()"
          [sort]="boxSort()"
          (typeChange)="boxType.set($event)"
          (sortChange)="boxSort.set($event)"
        ></app-box-filters>

        <div class="favorites__box">
          <app-box-card
            *ngFor="let pokemon of box(); let i = index; trackBy: trackByPokemonId"
            [pokemon]="pokemon"
            [delay]="i | stagger: 30"
            (toParty)="sendToParty($event)"
          ></app-box-card>
        </div>
      </section>
    </ng-container>
  </ng-container>

  <ng-template #empty>
    <app-state-panel
      motion="float"
      heading="Your party is empty"
      text="Tap the heart on any Pokémon to bring it here. Not sure where to start? These three are looking for a trainer."
      actionLabel="Explore the Pokédex"
      actionLink="/search"
    >
      <div class="favorites__box favorites__box--suggestions" *ngIf="suggestions().length">
        <app-box-card
          *ngFor="let pokemon of suggestions(); let i = index; trackBy: trackByPokemonId"
          [pokemon]="pokemon"
          [delay]="i * 90"
          [draggable]="false"
          [showPartyAction]="false"
        ></app-box-card>
      </div>
    </app-state-panel>
  </ng-template>
</section>
