<section class="dex">
  <header class="dex__header">
    <h1>{{ trainerName }}'s Pokémon</h1>
    <p>A hand-picked squad, ready to battle.</p>
  </header>

  <div class="dex__grid">
    <app-home-card
      *ngFor="let pokemon of pokemons; let i = index; trackBy: trackByPokemonId"
      class="dex__cell dex__cell--{{ pokemon.bento }}"
      [pokemon]="pokemon"
      [size]="pokemon.bento"
      [index]="i"
    ></app-home-card>
  </div>

  <a class="dex__more" routerLink="/home/detail">
    See Pokémon detail
    <span aria-hidden="true">&rarr;</span>
  </a>

  <router-outlet/>
</section>
