<ul class="gallery">
  <li *ngFor="let stat of swatches; let i = index; trackBy: trackByType">
    <a
      class="swatch"
      [appTypeColor]="stat.type"
      [style.--i]="i"
      routerLink="/search"
      [queryParams]="{ types: stat.type }"
      [attr.aria-label]="(stat.type | titlecase) + ' type' + (stat.count ? ', ' + stat.count + ' Pokémon' : '')"
    >
      <span class="swatch__chip">
        <img
          *ngIf="stat.representativeId"
          [src]="stat.representativeId | pokemonArtwork"
          alt=""
          width="475"
          height="475"
          loading="lazy"
          decoding="async"
          appArtworkFallback
        />
      </span>
      <span class="swatch__name">{{ stat.type }}</span>
      <span class="swatch__hex">{{ stat.type | pokemonTypeColor }}</span>
      <span class="swatch__count">{{ stat.count ? (stat.count | number) + ' Pokémon' : '&nbsp;' }}</span>
    </a>
  </li>
</ul>
