<div
  class="timeline"
  [class.timeline--start]="rail.canScrollStart()"
  [class.timeline--end]="rail.canScrollEnd()"
>
  <button
    type="button"
    class="timeline__arrow timeline__arrow--prev"
    aria-label="Show earlier regions"
    tabindex="-1"
    [hidden]="!rail.canScrollStart()"
    (click)="rail.scrollByPage(-1)"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
  </button>

  <ol #rail="scrollRail" appScrollRail class="timeline__rail">
    <li *ngFor="let region of regions" class="timeline__stop">
      <a
        class="region"
        routerLink="/search"
        [queryParams]="{ gen: region.id }"
        [attr.aria-label]="'Generation ' + region.numeral + ', ' + region.region + ': ' + region.speciesCount + ' Pokémon'"
      >
        <span class="region__dot" aria-hidden="true"></span>
        <span class="region__numeral">{{ region.numeral }}</span>
        <span class="region__name">{{ region.region }}</span>
        <span class="region__range">{{ region.firstId | pokedexId }}–{{ region.lastId | pokedexId }}</span>
        <span class="region__art">
          <img
            [src]="region.starterId | pokemonArtwork"
            alt=""
            width="475"
            height="475"
            loading="lazy"
            decoding="async"
            appArtworkFallback
          />
        </span>
        <span class="region__count">{{ region.speciesCount }} species</span>
      </a>
    </li>
  </ol>

  <button
    type="button"
    class="timeline__arrow timeline__arrow--next"
    aria-label="Show later regions"
    tabindex="-1"
    [hidden]="!rail.canScrollEnd()"
    (click)="rail.scrollByPage(1)"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
  </button>
</div>
