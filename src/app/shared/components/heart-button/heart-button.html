<button
  type="button"
  class="heart"
  [class.heart--active]="active"
  [appTypeColor]="type"
  [attr.aria-pressed]="active"
  [attr.aria-label]="active ? 'Remove ' + label + ' from favorites' : 'Add ' + label + ' to favorites'"
  [attr.title]="active ? 'Remove from favorites' : 'Add to favorites'"
  (click)="toggle($event)"
>
  <svg class="heart__icon" viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M12 20.5s-7.4-4.5-9.2-9.4C1.6 7.6 3.9 4.5 7.3 4.5c2 0 3.6 1.1 4.7 2.7 1.1-1.6 2.7-2.7 4.7-2.7 3.4 0 5.7 3.1 4.5 6.6-1.8 4.9-9.2 9.4-9.2 9.4z"
    />
  </svg>
  <span class="heart__burst" *ngFor="let key of bursts(); trackBy: trackByKey" aria-hidden="true">
    <i *ngFor="let p of particles" [style.--p]="p"></i>
  </span>
</button>
