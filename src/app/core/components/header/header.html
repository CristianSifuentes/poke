<header class="navbar">
  <a class="navbar__brand" routerLink="/home" aria-label="{{ title() }} home">
    <span class="navbar__logo" aria-hidden="true"></span>
    <span class="navbar__title">{{ title() }}</span>
  </a>

  <div class="navbar__actions">
    <app-theme-toggle></app-theme-toggle>

    <button
      class="navbar__toggle"
      type="button"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="isMenuOpen()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <nav class="navbar__nav" [class.navbar__nav--open]="isMenuOpen()" aria-label="Main navigation" (click)="closeMenu()">
    <a
      class="navbar__link"
      routerLink="/home"
      routerLinkActive="navbar__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >Home</a>
    <a
      class="navbar__link"
      routerLink="/search"
      routerLinkActive="navbar__link--active"
      [routerLinkActiveOptions]="{ exact: false }"
      [class.navbar__link--section]="inPokedex()"
    >Pokédex</a>
    <a
      class="navbar__link"
      routerLink="/favorites"
      routerLinkActive="navbar__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >Favorites<span
        class="navbar__badge"
        *ngFor="let count of [favorites.count()]"
        [hidden]="!count"
        [attr.aria-label]="count + ' favorites'"
      >{{ count }}</span></a>
    <a
      class="navbar__link"
      routerLink="/about"
      routerLinkActive="navbar__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >About</a>
  </nav>
</header>
