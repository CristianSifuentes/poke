<button
  type="button"
  class="theme-toggle"
  role="switch"
  [class.theme-toggle--dark]="themes.isDark()"
  [attr.aria-checked]="themes.isDark()"
  aria-label="Dark theme"
  [attr.title]="themes.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
  (click)="toggle($event)"
>
  <svg class="theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
    <mask id="theme-toggle-moon">
      <rect width="24" height="24" fill="#fff" />
      <circle class="theme-toggle__bite" cx="31" cy="1" r="8" fill="#000" />
    </mask>
    <circle class="theme-toggle__core" cx="12" cy="12" r="5" mask="url(#theme-toggle-moon)" />
    <g class="theme-toggle__rays">
      <line x1="12" y1="1.5" x2="12" y2="3.5" />
      <line x1="12" y1="20.5" x2="12" y2="22.5" />
      <line x1="1.5" y1="12" x2="3.5" y2="12" />
      <line x1="20.5" y1="12" x2="22.5" y2="12" />
      <line x1="4.6" y1="4.6" x2="6" y2="6" />
      <line x1="18" y1="18" x2="19.4" y2="19.4" />
      <line x1="4.6" y1="19.4" x2="6" y2="18" />
      <line x1="18" y1="6" x2="19.4" y2="4.6" />
    </g>
  </svg>
</button>
